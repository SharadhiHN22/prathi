spring.application.name=editshare

# Server Port (Uses Render's $PORT environment variable, defaults to 8085 locally)
server.port=${PORT:8085}

# PostgreSQL Datasource Configuration (Uses environment variables without hardcoded secrets)
spring.datasource.url=${SPRING_DATASOURCE_URL:${DATABASE_URL:jdbc:postgresql://localhost:5432/prathi}}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:${DATABASE_USERNAME:postgres}}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:${DATABASE_PASSWORD:}}
spring.datasource.driver-class-name=org.postgresql.Driver

# Hikari Connection Pool Tuning
spring.datasource.hikari.maximum-pool-size=${HIKARI_MAX_POOL_SIZE:25}
spring.datasource.hikari.minimum-idle=${HIKARI_MIN_IDLE:5}
spring.datasource.hikari.connection-timeout=20000
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.max-lifetime=1200000

# JPA & Hibernate Configuration
spring.jpa.hibernate.ddl-auto=${HIBERNATE_DDL_AUTO:update}
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.open-in-view=false

# App Public Domain (Automatically uses Render external URL or custom domain)
editshare.app.base-url=${APP_BASE_URL:${RENDER_EXTERNAL_URL:http://localhost:8085}}

# CORS Allowed Origins (Defaults to wildcard; set to custom domain if desired)
cors.allowed.origins=${CORS_ALLOWED_ORIGINS:*}

# Scheduled Cleanup Job Cron Expression (Every 5 minutes by default)
editshare.cleanup.cron=${CLEANUP_CRON:0 */5 * * * *}
